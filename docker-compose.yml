version: '3.8'

services:
  expense-categorizer:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - MLFLOW_TRACKING_URI=sqlite:///mlruns/mlflow.db
    volumes:
      - ./data:/app/data
      - ./mlruns:/app/mlruns
      - ./models:/app/models
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Add MLflow UI for experiment tracking
  mlflow-ui:
    image: python:3.11-slim
    ports:
      - "5000:5000"
    command: >
      bash -c "
        pip install mlflow &&
        mlflow ui --backend-store-uri sqlite:///mlruns/mlflow.db --host 0.0.0.0 --port 5000
      "
    volumes:
      - ./mlruns:/mlruns
    depends_on:
      - expense-categorizer

